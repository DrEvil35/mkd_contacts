<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Старшие по подъездам</title>
  <meta name="description" content="Контакты старших по подъездам для помощи по вопросам голосования.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <div class="badge">МКД</div>
      <h1 id="page-title">Старшие по подъездам</h1>
      <p id="description" class="description">
        Выберите свой подъезд, чтобы увидеть председателя, ответственного по подъезду и замещающее лицо.
      </p>

      <nav id="entrance-list" class="links" aria-label="Список подъездов">
        <noscript>Для просмотра списка контактов включите JavaScript.</noscript>
      </nav>

      <p id="footer" class="footer">Страница создана для удобства жителей дома.</p>
    </section>
  </main>

  <div id="contact-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" aria-label="Закрыть окно" data-close-modal>×</button>
      <h2 id="modal-title">Контакты</h2>
      <p id="modal-subtitle" class="modal-subtitle"></p>
      <div id="modal-contacts" class="person-list"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
