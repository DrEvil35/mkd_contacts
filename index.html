<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ответственные лица</title>
  <meta name="description" content="Контакты ответственных лиц совета дома Шекснинский проспект д.16.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="page-title">
      <div class="flower-ornament" aria-hidden="true">
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
        <span>✿</span>
      </div>
      <div id="top-line" class="badge"></div>

      <h1 id="page-title"></h1>
      <p id="description" class="description"></p>

      <section id="important-section" class="important-section" hidden>
        <button id="important-toggle" class="important-toggle" type="button" aria-expanded="false">
          <span class="important-icon">i</span>
          <span class="important-text">
            <span id="important-title" class="important-title"></span>
            <span id="important-summary" class="important-summary"></span>
          </span>
          <span class="important-chevron">⌄</span>
        </button>
        <div id="important-content" class="important-content" hidden></div>
      </section>

      <nav id="entrance-list" class="entrance-list" aria-label="Список подъездов">
        <noscript>Для просмотра списка контактов включите JavaScript.</noscript>
      </nav>

      <section id="common-contacts" class="common-section" aria-labelledby="common-title" hidden>
        <h2 id="common-title" class="common-title">Общие контакты</h2>
        <div id="common-list" class="person-list"></div>
      </section>

      <p id="footer" class="footer"></p>
      <div id="debug-error" class="debug-error" hidden></div>
    </section>
  </main>

  <div id="contact-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" aria-label="Закрыть окно" data-close-modal>×</button>
      <div class="modal-kicker">Ответственный</div>
      <h2 id="modal-title">Подъезд</h2>
      <p id="modal-subtitle" class="modal-subtitle"></p>
      <div id="modal-contacts" class="person-list"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
